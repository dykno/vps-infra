# Settings shared by every site
server_tokens off;

# Like nginx's default "main" format, but starting with the requested host
# so the sites can be told apart in `docker compose logs nginx`.
# Each server block opts in with its own access_log line: adding one here,
# at the http level, would log every request twice alongside the stock one.
log_format vhost '$host $remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_x_forwarded_for"';

gzip on;
gzip_comp_level 4;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
