# Catch-all for hostnames we don't serve
# Without this, nginx would answer them with
# whichever site happens to load first.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}
