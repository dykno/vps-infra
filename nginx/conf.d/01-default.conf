# Catch-all for hostnames we don't serve (e.g. leftover speedtrap.io traffic
# or bots hitting the bare IP). Without this, nginx would answer them with
# whichever site happens to load first.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
