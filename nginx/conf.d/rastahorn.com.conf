map $http_user_agent $is_ios {
    default         0;
    ~*(iPhone|iPad) 1;
}

server {
    listen 80;
    server_name rastahorn.com www.rastahorn.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name rastahorn.com www.rastahorn.com;

    ssl_certificate     /etc/letsencrypt/live/rastahorn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rastahorn.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /srv/rastahorn.com/www;
    index index.html;

    # The site used to be PHP; keep old links and bookmarks working
    rewrite ^(.*)\.php$ $1.html last;

    # tdfw was an identical copy of td4w
    location ^~ /tdfw {
        return 301 /td4w/;
    }

    # iOS visitors on the horn pages go to the App Store.
    # Never apply this to /privacy or /support: the App Store listing links there.
    location ~ ^/(index\.html|board\.html|td4w/.*)?$ {
        if ($is_ios) {
            return 302 https://apps.apple.com/us/app/rastahorn/id1489107571;
        }
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
